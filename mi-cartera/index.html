<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Cartera">
<meta name="theme-color" content="#05070f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9eef6" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Mi Cartera</title>
<style>
:root{
  --bg:#05070f;
  --text:#f5f7fb; --text2:rgba(235,240,255,.64); --text3:rgba(235,240,255,.4);
  --glass:rgba(255,255,255,.075); --glass-strong:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.15); --hi:rgba(255,255,255,.32);
  --shadow:0 12px 40px rgba(0,0,0,.38);
  --sep:rgba(255,255,255,.09);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2;
  --blob1:#1d4bff; --blob2:#0fb5a8; --blob3:#6a3cff;
  --sheet:rgba(26,29,40,.8);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#e9eef6;
    --text:#0b1220; --text2:rgba(15,25,45,.62); --text3:rgba(15,25,45,.4);
    --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78);
    --stroke:rgba(255,255,255,.85); --hi:rgba(255,255,255,1);
    --shadow:0 10px 36px rgba(40,60,110,.16);
    --sep:rgba(15,25,45,.08);
    --blue:#007aff; --green:#28a745; --red:#ff3b30; --orange:#f08c00; --purple:#a64fd6;
    --blob1:#8fb3ff; --blob2:#8de3d6; --blob3:#c7b2ff;
    --sheet:rgba(244,246,251,.84);
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;min-height:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
select.field{background-image:none}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Fondo tipo wallpaper para que el cristal tenga algo que refractar */
.wall{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.wall i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.wall i:nth-child(1){width:70vw;height:70vw;max-width:520px;max-height:520px;background:var(--blob1);top:-18%;left:-22%}
.wall i:nth-child(2){width:60vw;height:60vw;max-width:440px;max-height:440px;background:var(--blob2);top:38%;right:-28%;opacity:.55}
.wall i:nth-child(3){width:65vw;height:65vw;max-width:480px;max-height:480px;background:var(--blob3);bottom:-22%;left:-10%;opacity:.6}

/* Liquid glass */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.04),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.07) 100%)}
.glass>*{position:relative}

.app{max-width:540px;margin:0 auto;padding:10px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px;margin-bottom:6px}
.top .date{color:var(--text2);font-size:15px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text2)}
.pill svg{width:14px;height:14px}
.pill.spin svg{animation:spin 1s linear infinite}
.pill.err{color:var(--orange)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:4px 2px 16px}

/* Hero */
.hero{padding:18px 4px 18px}
.hero-label{color:var(--text2);font-size:15px;font-weight:500}
.hero-num{font-family:var(--round);font-weight:700;font-size:clamp(44px,13vw,60px);letter-spacing:-1.5px;line-height:1.05;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:.48em;letter-spacing:-.5px;color:var(--text2);font-weight:600}
.hero-day{font-size:15px;font-weight:600}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--text2)}

.alloc{display:flex;gap:3px;height:8px;border-radius:99px;overflow:hidden;margin:2px 4px 18px}
.alloc span{min-width:0;border-radius:99px}

/* Listas estilo iOS */
.list{border-radius:24px;overflow:hidden;margin-bottom:22px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:60px}
.row+.row{box-shadow:inset 0 .5px 0 var(--sep)}
.row:active{background:var(--glass-strong)}
.ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff}
.row .mid{flex:1;min-width:0}
.row .t,.row .s,.row .v,.row .vs{display:block}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.row .vs{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}

.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 10px}
.sec h2{font-size:22px;font-weight:700}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.mnav button svg{width:16px;height:16px}
.mnav span{font-size:15px;font-weight:600;min-width:120px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:24px;margin-bottom:14px}
.stats div{padding:14px 8px 14px 14px;min-width:0}
.stats div+div{box-shadow:inset .5px 0 0 var(--sep)}
.stats p{font-size:13px;color:var(--text2);font-weight:500}
.stats b{display:block;font-family:var(--round);font-size:clamp(15px,4.3vw,19px);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats em{display:block;font-style:normal;font-size:11.5px;color:var(--text3);margin-top:2px}

.card{border-radius:26px;padding:18px;margin-bottom:14px}
.card h3{font-size:17px;font-weight:700;margin-bottom:12px}
.card .sub{color:var(--text2);font-size:13px}

.donutwrap{display:flex;gap:16px;align-items:center}
.donut{flex:none;width:132px;height:132px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-family:var(--round);font-size:17px;display:block;font-variant-numeric:tabular-nums}
.donut .c span{font-size:11px;color:var(--text2)}
.legend{flex:1;min-width:0;display:grid;gap:9px}
.legend div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px}
.legend i{width:9px;height:9px;border-radius:50%}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}

.chart{width:100%;height:140px;display:block;overflow:visible}
.chartmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-top:6px}
.empty{color:var(--text2);font-size:14px;padding:6px 0}

/* Inversiones */
.inv{border-radius:30px;padding:20px;margin-bottom:16px}
.inv-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.inv-head .t{font-size:18px;font-weight:700}
.inv-head .s{font-size:13px;color:var(--text2)}
.inv-val{font-family:var(--round);font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.inv-chg{font-size:15px;font-weight:600;margin:4px 0 14px}
.kv{border-radius:18px;background:var(--glass);margin-bottom:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:15px}
.kv div+div{box-shadow:inset 0 .5px 0 var(--sep)}
.kv span{color:var(--text2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv span{white-space:nowrap}
.btns{display:flex;gap:10px}
.btn{flex:1;height:46px;border-radius:999px;font-weight:600;font-size:15px;display:grid;place-items:center;padding:0 14px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(10,132,255,.35)}
.btn.danger{color:var(--red)}
.note{font-size:12.5px;color:var(--text3);margin-top:12px;line-height:1.45}
.note a{color:var(--blue)}

/* Movimientos */
.day{font-size:13px;font-weight:600;color:var(--text2);margin:16px 6px 8px;text-transform:capitalize}
.chips{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}

/* Dock flotante */
.dock{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;align-items:center;padding:0 14px;z-index:20;pointer-events:none}
.dock>*{pointer-events:auto}
.tabbar{display:flex;border-radius:999px;padding:5px;gap:2px;flex:1;max-width:420px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--text);transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--blue);background:var(--glass-strong)}
.fab{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.fab svg{width:26px;height:26px}
.fab:active,.btn:active,.circle:active{transform:scale(.94)}

/* Hojas modales */
#sheetRoot .scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .3s;z-index:40}
#sheetRoot .sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:38px;padding:8px 18px 22px;z-index:41;transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.25,1);background:var(--sheet);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi),0 -10px 50px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%)}
#sheetRoot .sheet::before{display:none}
#sheetRoot.open .scrim{opacity:1}
#sheetRoot.open .sheet{transform:none}
.grabber{width:38px;height:5px;border-radius:9px;background:var(--text3);margin:2px auto 8px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h2{font-size:17px;font-weight:700;text-align:center;flex:1}
.circle{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi)}
.circle svg{width:18px;height:18px}
.circle.primary{background:var(--blue);color:#fff;border-color:transparent}

.seg{display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.15),inset 0 1px 0 var(--hi)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 18px}
.amount input{width:1.6ch;max-width:100%;min-width:1ch;text-align:center;background:none;border:0;font-family:var(--round);font-size:52px;font-weight:700;letter-spacing:-1px;outline:none;font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--text3)}
.amount span{font-family:var(--round);font-size:30px;font-weight:700;color:var(--text2)}
.lbl{font-size:13px;font-weight:600;color:var(--text2);margin:0 4px 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-bottom:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--text2);padding:2px 0}
.cat .ico{width:48px;height:48px;border-radius:16px;font-size:22px;background:var(--glass);border:1px solid var(--stroke);transition:box-shadow .15s,background .15s}
.cat[aria-pressed="true"]{color:var(--text)}
.cat[aria-pressed="true"] .ico{background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 35%,transparent)}
.field{display:block;width:100%;height:50px;padding:0 16px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);font-size:16px;margin-bottom:12px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--blue)}
input[type=date].field{line-height:50px}
.err-msg{color:var(--red);font-size:14px;font-weight:500;margin:0 4px 12px;min-height:0}
.hint{font-size:13px;color:var(--text2);margin:-4px 4px 14px;line-height:1.4}
.hint a{color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .field{margin-bottom:12px}

.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

.welcome h2{font-family:var(--round);font-size:28px;font-weight:700;margin:6px 4px 6px}
.welcome p.lead{color:var(--text2);font-size:15px;margin:0 4px 18px;line-height:1.45}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Banco */
.banner{display:block;width:100%;text-align:left;border-radius:20px;padding:13px 16px;margin:0 0 14px}
.banner b{display:block;font-size:15px;font-weight:600}
.banner span{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.banner.bad b{color:var(--red)}
.steps{margin:0 4px 12px 22px;color:var(--text2);font-size:14.5px;line-height:1.45}
.steps li{margin-bottom:8px;padding-left:2px}
.steps b{color:var(--text);font-weight:600}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;word-break:break-all;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:11px 14px;margin:0 0 10px}
.adv{margin:2px 4px 12px;font-size:14px;color:var(--text2)}
.adv summary{cursor:pointer;padding:6px 0}
a.btn{text-decoration:none;color:inherit}
.btn:disabled{opacity:.55}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="app" class="app"></main>

<nav class="dock" aria-label="Secciones">
  <div class="tabbar glass" role="tablist">
    <button class="tab" role="tab" data-tab="resumen" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Resumen</button>
    <button class="tab" role="tab" data-tab="movs" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Movimientos</button>
    <button class="tab" role="tab" data-tab="inv" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Inversiones</button>
    <button class="tab" role="tab" data-tab="ajustes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </div>
  <button class="fab glass" id="fab" aria-label="Añadir movimiento">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>

<script>
"use strict";
const STORE = 'caja.v1';
const $ = s => document.querySelector(s);

/* ---------- Formatos ---------- */
const fmtE = new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', useGrouping:'always'});
const eur = v => (v == null || isNaN(v)) ? '—' : fmtE.format(v);
const sign = v => v > 0.004 ? '+' : v < -0.004 ? '−' : '';
const eurS = v => (v == null || isNaN(v)) ? '—' : sign(v) + fmtE.format(Math.abs(v));
const pct = v => (v == null || isNaN(v) || !isFinite(v)) ? '—' : sign(v) + Math.abs(v).toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' %';
const btcF = v => (v || 0).toLocaleString('es-ES',{minimumFractionDigits:0, maximumFractionDigits:8}) + ' BTC';
const usd = v => v == null ? '—' : v.toLocaleString('es-ES',{style:'currency', currency:'USD'});
const cls = v => v > 0.004 ? 'up' : v < -0.004 ? 'down' : 'flat';
const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const num = s => {
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/\s|€/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? NaN : n;
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return cap(new Date(y, m - 1, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'})); };
const shiftMonth = (ym, d) => { const [y, m] = ym.split('-').map(Number); const x = new Date(y, m - 1 + d, 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); };
function eurBig(v){
  if (v == null || isNaN(v)) return '—';
  const parts = fmtE.formatToParts(v);
  let main = '', tail = '';
  let inTail = false;
  for (const p of parts){ if (p.type === 'decimal') inTail = true; if (inTail || p.type === 'currency' || p.type === 'literal' && inTail) tail += p.value; else main += p.value; }
  return `${esc(main.trim())}<small>${esc(tail)}</small>`;
}

/* ---------- Estado ---------- */
const fresh = () => ({v:1, setup:false, key:'', init:{cuenta:0, efectivo:0, spUnits:0, spPending:null, spInv:0, btc:0, btcInv:0}, tx:[], prices:{}, history:{}});
let S;
try { S = JSON.parse(localStorage.getItem(STORE)) || fresh(); } catch (e) { S = fresh(); }
S = Object.assign(fresh(), S); S.init = Object.assign(fresh().init, S.init);
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('No se ha podido guardar en el iPhone'); } }

let tab = 'resumen';
let curMonth = iso(new Date()).slice(0, 7);
let refreshing = false, priceErr = false;

/* ---------- Cálculos ---------- */
function holdings(excludeId){
  const i = S.init;
  const h = {cuenta:i.cuenta, efectivo:i.efectivo, spUnits:i.spUnits, spInv:i.spInv, btc:i.btc, btcInv:i.btcInv};
  for (const t of S.tx){
    if (t.id === excludeId) continue;
    if (t.type === 'gasto') h[t.from] -= t.amount;
    else if (t.type === 'ingreso') h[t.to] += t.amount;
    else { move(h, t.from, -1, t); move(h, t.to, 1, t); }
  }
  return h;
}
function move(h, place, s, t){
  if (place === 'cuenta' || place === 'efectivo') h[place] += s * t.amount;
  else if (place === 'sp'){ h.spUnits += s * (t.units || 0); h.spInv += s * (t.spInv || 0); }
  else if (place === 'btc'){ h.btc += s * (t.btc || 0); h.btcInv += s * (t.btcInv || 0); }
}
const spEur = () => (S.prices.spyUsd && S.prices.eurPerUsd) ? S.prices.spyUsd * S.prices.eurPerUsd : null;
function ensureSpUnits(){
  const se = spEur();
  if (S.init.spPending != null && se){ S.init.spUnits = S.init.spPending / se; S.init.spPending = null; save(); }
}
function snapshot(){
  const h = holdings(), p = S.prices, se = spEur();
  const spV = S.init.spPending != null ? S.init.spPending : (se ? h.spUnits * se : (h.spUnits ? null : 0));
  const btcV = p.btcEur ? h.btc * p.btcEur : (h.btc ? null : 0);
  const total = h.cuenta + h.efectivo + (spV || 0) + (btcV || 0);
  const spDay = (spV && p.spyChg != null && S.init.spPending == null) ? spV - spV / (1 + p.spyChg / 100) : 0;
  const btcDay = (btcV && p.btcChg != null) ? btcV - btcV / (1 + p.btcChg / 100) : 0;
  return {h, spV, btcV, total, spDay, btcDay};
}
function recordHistory(){
  const s = snapshot();
  if (s.spV == null || s.btcV == null) return;
  S.history[iso(new Date())] = r2(s.total);
  const keys = Object.keys(S.history).sort();
  while (keys.length > 730) delete S.history[keys.shift()];
  save();
}
function monthStats(ym){
  let inc = 0, exp = 0; const by = {};
  for (const t of S.tx){
    if (!t.date.startsWith(ym)) continue;
    if (t.type === 'ingreso') inc += t.amount;
    else if (t.type === 'gasto'){ exp += t.amount; by[t.cat] = (by[t.cat] || 0) + t.amount; }
  }
  return {inc, exp, by};
}

/* ---------- Precios ---------- */
async function fetchJ(url){
  const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 9000);
  try { const r = await fetch(url, {signal:ac.signal, cache:'no-store'}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function refreshPrices(manual){
  if (refreshing) return;
  refreshing = true; priceErr = false; paintStatus();
  const p = Object.assign({}, S.prices); const fails = [];
  try {
    const r = await fetchJ('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur,usd&include_24hr_change=true');
    if (r.bitcoin && r.bitcoin.eur){ p.btcEur = r.bitcoin.eur; p.btcUsd = r.bitcoin.usd; p.btcChg = r.bitcoin.eur_24h_change; p.btcTs = Date.now(); }
    else fails.push('Bitcoin');
  } catch (e) { fails.push('Bitcoin'); }
  try {
    const r = await fetchJ('https://api.frankfurter.app/latest?from=USD&to=EUR');
    if (r.rates && r.rates.EUR) p.eurPerUsd = r.rates.EUR; else throw 0;
  } catch (e) { if (p.btcEur && p.btcUsd) p.eurPerUsd = p.btcEur / p.btcUsd; }
  if (S.key){
    try {
      const r = await fetchJ('https://finnhub.io/api/v1/quote?symbol=SPY&token=' + encodeURIComponent(S.key));
      if (r && r.c){ p.spyUsd = r.c; p.spyChg = r.dp; p.spyTs = Date.now(); } else fails.push('S&P 500');
    } catch (e) { fails.push('S&P 500'); }
  }
  S.prices = p; p.ts = Date.now(); save();
  ensureSpUnits(); recordHistory();
  refreshing = false; priceErr = fails.length > 0;
  if (manual && fails.length) toast('No se ha podido actualizar: ' + fails.join(' y '));
  render();
}
function statusText(){
  if (refreshing) return 'Actualizando';
  if (priceErr) return 'Sin conexión';
  if (!S.prices.ts) return 'Sin precios';
  const m = Math.round((Date.now() - S.prices.ts) / 60000);
  return m < 1 ? 'Ahora' : m < 60 ? `Hace ${m} min` : new Date(S.prices.ts).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
const refreshIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>';
function statusPill(){ return `<button class="pill glass ${refreshing ? 'spin' : ''} ${priceErr ? 'err' : ''}" data-act="refresh" aria-label="Actualizar precios">${refreshIcon}<span>${statusText()}</span></button>`; }
function paintStatus(){ const b = document.querySelector('[data-act="refresh"]'); if (b) b.outerHTML = statusPill(); }

/* ---------- Gráficas ---------- */
function donut(by, total){
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([id, v]) => {
    const len = v / total * C; const gap = Object.keys(by).length > 1 ? 2.5 : 0;
    const s = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${CAT[id].c}" stroke-width="16" stroke-linecap="butt" stroke-dasharray="${Math.max(len - gap, .5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--sep)" stroke-width="16"/>${segs}</svg>`;
}
function lineChart(){
  const pts = Object.entries(S.history).sort((a, b) => a[0] < b[0] ? -1 : 1);
  if (pts.length < 2) return `<p class="empty">La gráfica se rellena sola: cada día que abres la app guarda tu patrimonio de ese día.</p>`;
  const W = 320, H = 140, P = 8;
  const vals = pts.map(p => p[1]); let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1){ mx += 1; mn -= 1; }
  const x = i => P + i * (W - 2 * P) / (pts.length - 1);
  const y = v => P + (H - 2 * P) * (1 - (v - mn) / (mx - mn));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const area = line + ` L${x(pts.length - 1).toFixed(1)} ${H} L${x(0).toFixed(1)} ${H} Z`;
  const first = vals[0], last = vals[vals.length - 1];
  const f = d => new Date(d + 'T12:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--blue);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--blue);stop-opacity:0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${line}" fill="none" style="stroke:var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="chartmeta"><span>${f(pts[0][0])}</span><span class="${cls(last - first)}">${eurS(last - first)} desde el inicio</span><span>${f(pts[pts.length - 1][0])}</span></div>`;
}

  const sum = parts.reduce((a, [, v]) => a + Math.max(0, v || 0), 0) || 1;
  const day = s.spDay + s.btcDay, invV = (s.spV || 0) + (s.btcV || 0);
  const dayPct = invV - day ? day / (invV - day) * 100 : 0;
  const sub = k => {
    if (k === 'sp') return S.init.spPending != null ? 'Falta el precio: añade la clave en Ajustes' : 'Aportado ' + eur(h.spInv);
    if (k === 'btc') return btcF(h.btc);
    return Math.round(Math.max(0, k === 'cuenta' ? h.cuenta : h.efectivo) / sum * 100) + ' % del total';
  };
  const ahorro = m.inc - m.exp, tasa = m.inc ? ahorro / m.inc * 100 : null;
  const cats = Object.entries(m.by).sort((a, b) => b[1] - a[1]);

      ${ico(PLACES[k].e, PLACES[k].c)}

  </div>
  <div class="sec"><h2>Este mes</h2>${monthNav()}</div>
  <div class="stats glass">
    <div><p>Ingresos</p><b class="up">${eur(m.inc)}</b></div>
    <div><p>Gastos</p><b>${eur(m.exp)}</b></div>

  </div>

    <h3>Gastos por categoría</h3>
    ${cats.length ? `<div class="donutwrap">
      <div class="donut">${donut(m.by, m.exp)}<div class="c"><div><b>${eur(m.exp)}</b><span>gastado</span></div></div></div>
      <div class="legend">${cats.slice(0, 6).map(([id, v]) => `<div><i style="background:${CAT[id].c}"></i><span>${CAT[id].n}</span><b>${eur(v)}</b></div>`).join('')}
      ${cats.length > 6 ? `<div><i style="background:var(--text3)"></i><span>Resto</span><b>${eur(cats.slice(6).reduce((a, [, v]) => a + v, 0))}</b></div>` : ''}</div>
    </div>` : `<p class="empty">Sin gastos en ${monthLabel(curMonth).toLowerCase()}.</p>`}
  </div>
  <div class="card glass"><h3>Evolución del patrimonio</h3>${lineChart()}</div>`;
}

function txRow(t){
  let e, c, title, subt, amt, ac = '';
  if (t.type === 'transfer'){
    e = '⇄'; c = '#636366';
    title = `${PLACES[t.from].n} → ${PLACES[t.to].n}`;
    subt = t.note || (t.btc ? btcF(t.btc) : 'Movimiento entre tus sitios');
    amt = eur(t.amount);
  } else {
    const k = CAT[t.cat] || CAT.otros_g; e = k.e; c = k.c;
    title = t.note || k.n;
    subt = t.note ? `${k.n}, ${PLACES[t.from || t.to].n.toLowerCase()}` : PLACES[t.from || t.to].n;
    if (t.pending) subt += ', pendiente';
    amt = (t.type === 'gasto' ? '−' : '+') + eur(t.amount); ac = t.type === 'ingreso' ? 'up' : '';
  }
  return `<button class="row" data-act="edit" data-id="${t.id}">${ico(e, c)}<span class="mid"><span class="t">${esc(title)}</span><span class="s">${esc(subt)}</span></span><span class="r"><span class="v ${ac}">${amt}</span></span></button>`;
}
function vMovs(){
  const list = S.tx.filter(t => t.date.startsWith(curMonth)).sort((a, b) => a.date === b.date ? b.ts - a.ts : (a.date < b.date ? 1 : -1));
  const m = monthStats(curMonth);
  const groups = {};
  for (const t of list) (groups[t.date] = groups[t.date] || []).push(t);
  const dl = d => { const t = iso(new Date()), y = iso(new Date(Date.now() - 864e5)); return d === t ? 'Hoy' : d === y ? 'Ayer' : new Date(d + 'T12:00:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'}); };
  return `
  <div class="top"><span></span>${monthNav()}</div>
  <h1>Movimientos</h1>
  <div class="chips"><span class="chip glass up">Ingresos ${eur(m.inc)}</span><span class="chip glass">Gastos ${eur(m.exp)}</span></div>
  ${list.length ? Object.entries(groups).map(([d, ts]) => `<p class="day">${dl(d)}</p><div class="list glass">${ts.map(txRow).join('')}</div>`).join('')
  : `<div class="card glass" style="margin-top:14px"><p class="empty">No hay movimientos en ${monthLabel(curMonth).toLowerCase()}. Pulsa + para apuntar el primero.</p></div>`}`;
}

function saveTx(f){
  const amount = num(f.amount);
  if (!(amount > 0)) return 'Escribe un importe mayor que 0.';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return 'Elige una fecha.';
  const t = {id:f.editId || uid(), type:f.type, amount:r2(amount), note:f.note.trim().slice(0, 120), date:f.date, ts:Date.now()};
  if (f.type === 'gasto'){ t.cat = f.cat; t.from = f.place; }
  else if (f.type === 'ingreso'){ t.cat = f.cat; t.to = f.place; }
  else {
    if (f.from === f.to) return 'Elige dos sitios distintos.';
    t.from = f.from; t.to = f.to;
    ensureSpUnits();
    const h = holdings(f.editId), se = spEur();
    if (f.from === 'sp' || f.to === 'sp'){
      if (!se) return 'Para mover dinero al o desde el S&P 500 necesito su precio. Añade la clave de Finnhub en Ajustes.';
      t.units = amount / se;
      if (f.to === 'sp') t.spInv = amount;
      else {
        if (t.units > h.spUnits * 1.0001) return 'No tienes tanto en el S&P 500.';
        t.spInv = h.spUnits > 0 ? h.spInv * (t.units / h.spUnits) : 0;
      }
    }
    if (f.from === 'btc' || f.to === 'btc'){
      const q = num(f.qty);
      if (!(q > 0)) return 'Indica cuántos BTC.';
      t.btc = q;
      if (f.to === 'btc') t.btcInv = amount;
      else {
        if (q > h.btc * 1.000001) return 'No tienes tantos BTC.';
        t.btcInv = h.btc > 0 ? h.btcInv * (q / h.btc) : 0;
      }
    }
  }
  const editing = !!f.editId;
  const old = editing ? S.tx.find(x => x.id === f.editId) : null;
  if (old && old.bank){ t.bank = old.bank; t.merchant = old.merchant; if (old.pending) t.pending = true; if (t.type === old.type && t.cat) learnRule(old, t.cat); }
  S.tx = S.tx.filter(x => x.id !== t.id); S.tx.push(t); save(); recordHistory();
  closeSheet(); curMonth = t.date.slice(0, 7); render();
  toast(editing ? 'Movimiento actualizado' : (t.type === 'gasto' ? 'Gasto apuntado' : t.type === 'ingreso' ? 'Ingreso apuntado' : 'Movimiento apuntado'));
}

        S.init.btc += v - h.btc; S.init.btcInv += i - h.btcInv; save(); recordHistory(); closeSheet(); render(); toast('Bitcoin ajustado');
      });
  }
}

// La clave privada se guarda en IndexedDB como CryptoKey no exportable: ni la propia app puede leerla.
function idb(){
  return new Promise((ok, ko) => {
    const r = indexedDB.open('mi-cartera', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('keys');
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
}
async function keyGet(){ const db = await idb(); return new Promise(ok => { const q = db.transaction('keys').objectStore('keys').get('eb'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function keySet(k){ const db = await idb(); return new Promise((ok, ko) => { const tx = db.transaction('keys', 'readwrite'); k ? tx.objectStore('keys').put(k, 'eb') : tx.objectStore('keys').delete('eb'); tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); }); }
async function loadKey(){ try { bankKey = await keyGet(); } catch (e) { bankKey = null; } return bankKey; }

const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uStr = s => b64u(new TextEncoder().encode(s));
function derLen(n){ if (n < 128) return [n]; const b = []; while (n){ b.unshift(n & 255); n >>= 8; } return [0x80 | b.length, ...b]; }
function pkcs1to8(p1){
  const alg = [0x30, 0x0d, 0x06, 0x09, 0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01, 0x05, 0x00];
  const oct = [0x04, ...derLen(p1.length), ...p1];
  const body = [0x02, 0x01, 0x00, ...alg, ...oct];
  return new Uint8Array([0x30, ...derLen(body.length), ...body]);
}
async function importPem(text){
  const m = text.match(/-----BEGIN (RSA )?PRIVATE KEY-----([\s\S]+?)-----END (RSA )?PRIVATE KEY-----/);
  if (!m) throw new Error('El archivo no es una clave privada.');
  let der = Uint8Array.from(atob(m[2].replace(/\s+/g, '')), c => c.charCodeAt(0));
  if (m[1]) der = pkcs1to8(der);
  return crypto.subtle.importKey('pkcs8', der, {name:'RSASSA-PKCS1-v1_5', hash:'SHA-256'}, false, ['sign']);
}
async function jwt(appId, key){
  const now = Math.floor(Date.now() / 1000);
  const head = b64uStr(JSON.stringify({typ:'JWT', alg:'RS256', kid:appId}));
  const body = b64uStr(JSON.stringify({iss:'enablebanking.com', aud:'api.enablebanking.com', iat:now, exp:now + 3600}));
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(head + '.' + body));
  return head + '.' + body + '.' + b64u(sig);
}
async function eb(path, opts = {}, appId = S.bank.appId, key = bankKey){
  if (!key) throw new Error('Falta la clave del banco en este iPhone. Vuelve a importarla en Ajustes.');
  const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 25000);
  let r;
  try {
    r = await fetch(workerUrl() + path, {
      method: opts.method || 'GET', signal: ac.signal, cache: 'no-store',
      headers: Object.assign({Authorization: 'Bearer ' + await jwt(appId, key)}, opts.body ? {'Content-Type': 'application/json'} : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch (e) { throw new Error('No hay conexión con el banco ahora mismo.'); }
  finally { clearTimeout(tm); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok){
    const msg = d.message || d.detail || d.error || '';
    const err = new Error(r.status === 401 ? 'Enable Banking no reconoce la clave o el ID de la aplicación.'
      : r.status === 429 ? 'El banco limita las consultas. Prueba otra vez dentro de un rato.'
      : (msg ? `El banco ha respondido: ${msg}` : `El banco ha respondido con un error ${r.status}.`));
    err.status = r.status; err.data = d; throw err;
  }
  return d;
}

function guessCat(type, text, all){
  const k = merchantKey(text);
  if (k && S.bank.rules[type + ':' + k]) return S.bank.rules[type + ':' + k];
  const low = String(all || text || '').toLowerCase();
  for (const [cat, re] of (type === 'ingreso' ? INCOME_RULES : MERCHANT_RULES)) if (re.test(low)) return cat;
  return type === 'ingreso' ? 'otros_i' : 'otros_g';
}
function learnRule(oldTx, newCat){
  if (!oldTx.bank || !oldTx.merchant || oldTx.cat === newCat) return;
  const k = merchantKey(oldTx.merchant); if (!k) return;
  S.bank.rules[oldTx.type + ':' + k] = newCat;
  // Aplica la corrección a los demás movimientos del mismo comercio que siguen con la categoría automática.
  for (const t of S.tx) if (t.bank && t.type === oldTx.type && t.id !== oldTx.id && merchantKey(t.merchant) === k && t.cat === oldTx.cat) t.cat = newCat;
}

function txParts(x){
  const party = x.credit_debit_indicator === 'CRDT' ? (x.debtor && x.debtor.name) : (x.creditor && x.creditor.name);
  const info = Array.isArray(x.remittance_information) ? x.remittance_information.join(' ') : (x.remittance_information || '');
  const clean = v => String(v || '').replace(/\s+/g, ' ').trim();
  return {party: clean(party), info: clean(info || x.bank_transaction_code?.description)};
}
function txText(x){ const p = txParts(x); return p.party || p.info; }
function bankTxId(x, counter){
  const id = x.transaction_id || x.entry_reference;
  if (id) return 'eb:' + id;
  const base = ['h', x.booking_date || x.value_date || x.transaction_date, x.transaction_amount?.amount, x.credit_debit_indicator, txText(x)].join('|');
  counter[base] = (counter[base] || 0) + 1;
  return base + '#' + counter[base];
}
const prettyMerchant = s => { const t = String(s || '').trim(); return t && t === t.toUpperCase() ? t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : t; };

async function fetchAllTx(uid, dateFrom){
  const out = []; let ck = '', pages = 0;
  do {
    const q = new URLSearchParams({date_from: dateFrom}); if (ck) q.set('continuation_key', ck);
    const d = await eb(`/accounts/${encodeURIComponent(uid)}/transactions?${q}`);
    out.push(...(d.transactions || [])); ck = d.continuation_key || ''; pages++;
  } while (ck && pages < 15);
  return out;
}
function pickBalance(list){
  const pref = ['ITAV', 'CLAV', 'XPCD', 'ITBD', 'CLBD', 'OPAV', 'OPBD'];
  const bs = (list || []).filter(b => b.balance_amount && b.balance_amount.amount != null);
  bs.sort((a, b) => (pref.indexOf(a.balance_type) + 99) % 99 - (pref.indexOf(b.balance_type) + 99) % 99);
  return bs.length ? parseFloat(bs[0].balance_amount.amount) : null;
}

async function syncBank(manual){
  if (syncing || !bankOn()) return;
  if (!manual && Date.now() - S.bank.lastSync < 10 * 60000) return;
  if (!bankKey && !(await loadKey())){ S.bank.err = 'Falta la clave del banco en este iPhone.'; save(); render(); return; }
  if (S.bank.validUntil && new Date(S.bank.validUntil) < new Date()){ S.bank.err = 'El permiso del banco ha caducado.'; save(); render(); return; }
  syncing = true; paintBank();
  try {
    const last = S.bank.lastSync ? iso(new Date(S.bank.lastSync - 10 * 86400000)) : S.bank.since;
    const dateFrom = last < S.bank.since ? S.bank.since : last;
    const counter = {}, pending = [], booked = [];
    let balance = 0, haveBal = true;
    for (const acc of S.bank.accounts){
      const list = await fetchAllTx(acc, dateFrom);
      for (const x of list){
        const amt = Math.abs(parseFloat(x.transaction_amount?.amount));
        if (!(amt > 0)) continue;
        const date = x.booking_date || x.value_date || x.transaction_date || iso(new Date());
        if (date < S.bank.since) continue;
        const item = {x, amt, date, id: bankTxId(x, counter)};
        (x.status === 'PDNG' ? pending : booked).push(item);
      }
      const bal = pickBalance((await eb(`/accounts/${encodeURIComponent(acc)}/balances`)).balances);
      if (bal == null) haveBal = false; else balance += bal;
    }
    // Los pendientes se sustituyen en cada sincronización: el banco devuelve siempre la lista actual.
    S.tx = S.tx.filter(t => !(t.bank && t.pending));
    let added = 0;
    const add = (it, isPending) => {
      const type = it.x.credit_debit_indicator === 'CRDT' ? 'ingreso' : 'gasto';
      const parts = txParts(it.x), text = parts.party || parts.info;
      const t = {id: uid(), type, amount: r2(it.amt), note: prettyMerchant(text).slice(0, 120), date: it.date, ts: Date.now(), cat: guessCat(type, text, parts.party + ' ' + parts.info), bank: it.id, merchant: text};
      if (type === 'gasto') t.from = 'cuenta'; else t.to = 'cuenta';
      if (isPending) t.pending = true;
      S.tx.push(t); added++;
    };
    for (const it of booked){ if (S.bank.seen[it.id] || S.bank.skip[it.id]) continue; S.bank.seen[it.id] = it.date; add(it, false); }
    for (const it of pending){ if (S.bank.skip[it.id]) continue; add(it, true); }
    // Limpia ids antiguos para que no crezca sin límite.
    const cut = iso(new Date(Date.now() - 120 * 86400000));
    for (const k in S.bank.seen) if (S.bank.seen[k] < cut) delete S.bank.seen[k];
    if (haveBal){ const h = holdings(); S.init.cuenta += r2(balance) - h.cuenta; }
    S.bank.lastSync = Date.now(); S.bank.err = '';
    save(); recordHistory();
    const newBooked = added - pending.filter(it => !S.bank.skip[it.id]).length;
    if (manual) toast(newBooked > 0 ? `${newBooked} movimiento${newBooked > 1 ? 's' : ''} nuevo${newBooked > 1 ? 's' : ''} del banco` : 'Todo al día con el banco');
  } catch (e) {
    S.bank.err = e.message; save();
    if (manual) toast(e.message);
  } finally { syncing = false; render(); }
}

/* Avisos y tarjeta de ajustes */
function daysLeft(){ return S.bank.validUntil ? Math.ceil((new Date(S.bank.validUntil) - Date.now()) / 86400000) : null; }
function bankBanner(){
  if (!bankOn()) return '';
  const d = daysLeft();
  if (d != null && d <= 0) return `<button class="banner glass bad" data-act="bankrenew"><b>El permiso del banco ha caducado</b><span>Toca para renovarlo. Hasta entonces no entran movimientos nuevos.</span></button>`;
  if (d != null && d <= 7) return `<button class="banner glass" data-act="bankrenew"><b>El permiso del banco caduca en ${d} día${d > 1 ? 's' : ''}</b><span>Toca para renovarlo, tardas un minuto.</span></button>`;
  if (S.bank.err) return `<button class="banner glass bad" data-act="banksync"><b>No se ha podido leer el banco</b><span>${esc(S.bank.err)} Toca para reintentar.</span></button>`;
  return '';
}
function bankStatusLine(){
  if (syncing) return 'Leyendo el banco…';
  if (!S.bank.lastSync) return 'Aún sin sincronizar';
  const m = Math.round((Date.now() - S.bank.lastSync) / 60000);
  return 'Última lectura ' + (m < 1 ? 'ahora mismo' : m < 60 ? `hace ${m} min` : new Date(S.bank.lastSync).toLocaleString('es-ES', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}));
}
function vBankCard(){
  if (!bankOn()){
    return `<section class="card glass" id="bankCard">
      <h3>Banco</h3>
      <p class="hint" style="margin:0 0 12px">Conecta tu cuenta para que los gastos e ingresos se apunten solos y el saldo cuadre con el banco. Solo lectura: nadie puede mover tu dinero desde aquí.</p>
      <button class="btn primary" data-act="bankwizard" style="width:100%">${S.bank.appId ? 'Continuar la conexión' : 'Conectar banco'}</button>
    </section>`;
  }
  const d = daysLeft();
  return `<section class="card glass" id="bankCard">
    <h3>Banco</h3>
    <div class="kv">
      <div><span>Entidad</span><b>${esc(S.bank.aspsp?.name || '—')}</b></div>
      <div><span>Permiso</span><b>${d == null ? '—' : d > 0 ? `${d} días más` : 'Caducado'}</b></div>
    </div>
    <p class="hint" style="margin:12px 4px 12px">${esc(bankStatusLine())}${S.bank.err && !syncing ? '. ' + esc(S.bank.err) : ''}</p>
    <div class="btns"><button class="btn glass" data-act="banksync">Leer ahora</button><button class="btn glass" data-act="bankrenew">Renovar permiso</button></div>
    <div class="btns" style="margin-top:10px"><button class="btn glass danger" data-act="bankoff">Desconectar</button></div>
  </section>`;
}
function paintBank(){ const c = document.getElementById('bankCard'); if (c) c.outerHTML = vBankCard(); }

/* Asistente de conexión */
function copyBtn(text, label){ return `<button type="button" class="btn glass copy" data-copy="${esc(text)}">${esc(label)}</button>`; }
function wireCopy(root){
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); const o = b.textContent; b.textContent = 'Copiado'; setTimeout(() => b.textContent = o, 1400); }
    catch (e) { prompt('Copia esto:', b.dataset.copy); }
  });
}
function bankWizard(step){
  if (step == null) step = !S.bank.appId ? 1 : (bankKey ? 3 : 2);
  const steps = {
    1: () => `
      <div class="welcome"><h2>Crea tu acceso</h2><p class="lead">Enable Banking es la entidad regulada que lee tu cuenta por ti. Es gratis para uso personal y solo tú tendrás acceso.</p></div>
      <ol class="steps">
        <li>Abre el panel de Enable Banking y entra con tu email. Te llegará un enlace para iniciar sesión, sin contraseña.</li>
        <li>En <b>Add a new application</b>, elige <b>Production</b> y deja marcada la opción <b>Generate in the browser</b>.</li>
        <li>Ponle de nombre <b>Mi Cartera</b>. En <b>Allowed redirect URLs</b> pega esta dirección:</li>
      </ol>
      <p class="mono">${esc(CALLBACK_URL)}</p>
      <div class="btns" style="margin-bottom:14px">${copyBtn(CALLBACK_URL, 'Copiar dirección')}</div>
      <ol class="steps" start="4">
        <li>En los campos de privacidad y condiciones puedes poner cualquier enlace, como la página de Mi Cartera. Con uso personal no se revisan. Pon tu email donde pida uno.</li>
        <li>Pulsa <b>Register</b>. Se descargará un archivo <b>.pem</b>: es tu clave, guárdalo en Archivos.</li>
        <li>Abre la aplicación recién creada, pulsa <b>Activate by linking accounts</b>, elige tu banco y entra con tus claves.</li>
      </ol>
      <div class="btns"><a class="btn primary" href="${EB_PANEL}" target="_blank" rel="noopener">Abrir Enable Banking</a></div>
      <div class="btns" style="margin-top:10px"><button type="button" class="btn glass" data-step="2">Ya lo tengo</button></div>`,
    2: () => `
      <div class="welcome"><h2>Importa tu clave</h2><p class="lead">Elige el archivo .pem que se descargó. La clave se guarda en este iPhone de forma que ni siquiera Mi Cartera puede leerla de vuelta, solo usarla para firmar.</p></div>
      <button type="button" class="btn primary" id="pemBtn" style="width:100%">Elegir archivo .pem</button>
      <input type="file" id="pemIn" hidden>
      <p class="lbl" style="margin-top:16px">ID de la aplicación</p>
      <input class="field" id="appIdIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Se rellena solo con el nombre del archivo" value="${esc(S.bank.appId)}">
      <details class="adv"><summary>Avanzado</summary>
        <p class="lbl" style="margin-top:12px">Tu propio Worker (opcional)</p>
        <input class="field" id="workerIn" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(WORKER_DEFAULT)}" value="${esc(S.bank.worker)}">
      </details>
      <p class="hint" id="pemMsg">${bankKey ? 'Ya hay una clave guardada en este iPhone. Elige otra solo si quieres cambiarla.' : ''}</p>
      <div class="btns"><button type="button" class="btn primary" id="checkBtn">Comprobar</button></div>
      <div class="btns" style="margin-top:10px"><button type="button" class="btn glass" data-step="1">Volver</button></div>`,
    3: () => `
      <div class="welcome"><h2>Autoriza a Mi Cartera</h2><p class="lead">Ahora tu banco te pedirá permiso una vez más, esta vez para Mi Cartera. Al terminar se abrirá una página con un código.</p></div>
      <ol class="steps">
        <li>Pulsa <b>Ir al banco</b> y entra con tus claves.</li>
        <li>En la página final, pulsa <b>Copiar código</b>.</li>
        <li>Vuelve aquí y pulsa <b>Pegar código</b>.</li>
      </ol>
      <p class="lbl">Tu banco</p>
      <select class="field" id="bankSel" aria-label="Tu banco"><option value="">Cargando bancos…</option></select>
      <div class="btns"><button type="button" class="btn primary" id="goBank">Ir al banco</button></div>
      <p class="lbl" style="margin-top:18px">Código</p>
      <input class="field" id="codeIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Pégalo aquí">
      <div class="btns"><button type="button" class="btn glass" id="pasteBtn">Pegar código</button><button type="button" class="btn primary" id="finishBtn">Terminar</button></div>
      <p class="hint" id="authMsg" style="margin-top:12px"></p>`
  };
  openSheet(step === 3 && bankOn() ? 'Renovar permiso' : 'Conectar banco', steps[step](), () => closeSheet(), sh => {
    const body = sh.querySelector('.sbody');
    wireCopy(body);
    body.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { closeSheet(); setTimeout(() => bankWizard(+b.dataset.step), 400); });
    const errEl = sh.querySelector('#errMsg');
    if (step === 2){
      let picked = null;
      const msg = body.querySelector('#pemMsg');
      body.querySelector('#pemBtn').onclick = () => body.querySelector('#pemIn').click();
      body.querySelector('#pemIn').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        try {
          picked = await importPem(await f.text());
          const id = (f.name.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [])[0];
          if (id) body.querySelector('#appIdIn').value = id;
          msg.textContent = 'Clave leída. Pulsa Comprobar.'; errEl.textContent = '';
        } catch (er) { picked = null; errEl.textContent = er.message || 'No se ha podido leer el archivo.'; }
      };
      body.querySelector('#checkBtn').onclick = async () => {
        const appId = body.querySelector('#appIdIn').value.trim();
        const w = body.querySelector('#workerIn').value.trim();
        const key = picked || bankKey;
        errEl.textContent = '';
        if (!key) { errEl.textContent = 'Elige primero el archivo .pem.'; return; }
        if (!/^[0-9a-f-]{36}$/i.test(appId)) { errEl.textContent = 'El ID de la aplicación tiene que ser como aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.'; return; }
        if (w && !/^https:\/\//.test(w)) { errEl.textContent = 'La dirección del Worker tiene que empezar por https://'; return; }
        const btn = body.querySelector('#checkBtn'); btn.textContent = 'Comprobando…'; btn.disabled = true;
        const prevWorker = S.bank.worker; S.bank.worker = w;
        try {
          const app = await eb('/application', {}, appId, key);
          if (app.environment && String(app.environment).toUpperCase() !== 'PRODUCTION') throw new Error('Esa aplicación es de Sandbox. Crea una de Production.');
          if (app.active === false) throw new Error('La aplicación aún no está activa. En el panel pulsa Activate by linking accounts y vincula tu cuenta.');
          if (Array.isArray(app.redirect_urls) && app.redirect_urls.every(u => typeof u === 'string') && !app.redirect_urls.includes(CALLBACK_URL)) throw new Error('Falta la dirección de vuelta en la aplicación. Añade en Allowed redirect URLs: ' + CALLBACK_URL);
          if (picked){ await keySet(picked); bankKey = picked; }
          S.bank.appId = appId; save();
          closeSheet(); setTimeout(() => bankWizard(3), 400);
        } catch (er) {
          S.bank.worker = prevWorker;
          errEl.textContent = er.message; btn.textContent = 'Comprobar'; btn.disabled = false;
        }
      };
    }
    if (step === 3){
      const am = body.querySelector('#authMsg');
      const sel = body.querySelector('#bankSel');
      let banks = [];
      (async () => {
        try {
          if (!bankKey) await loadKey();
          banks = ((await eb('/aspsps?country=ES&psu_type=personal')).aspsps || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'es'));
          const pre = (S.bank.aspsp && banks.find(a => a.name === S.bank.aspsp.name)) || null;
          sel.innerHTML = (pre ? '' : '<option value="">Elige tu banco</option>') + banks.map((a, i) => `<option value="${i}" ${a === pre ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
        } catch (er) { sel.innerHTML = '<option value="">No se ha podido cargar la lista</option>'; errEl.textContent = er.message; }
      })();
      body.querySelector('#goBank').onclick = async e => {
        const go = e.currentTarget;
        const chosen = banks[+sel.value];
        errEl.textContent = '';
        if (sel.value === '' || !chosen){ errEl.textContent = 'Elige primero tu banco en la lista.'; return; }
        am.textContent = ''; go.textContent = 'Preparando…'; go.disabled = true;
        try {
          const maxS = chosen.maximum_consent_validity || 180 * 86400;
          const valid = new Date(Date.now() + Math.min(maxS, 180 * 86400) * 1000 - 3600000).toISOString();
          const state = uid() + uid();
          S.bank.pendingState = state; S.bank.aspsp = {name: chosen.name, country: chosen.country || 'ES'}; save();
          const r = await eb('/auth', {method:'POST', body:{access:{valid_until: valid}, aspsp: S.bank.aspsp, state, redirect_url: CALLBACK_URL, psu_type:'personal'}});
          // Un enlace real que se toca: iOS no bloquea su apertura como haría con window.open tras una espera.
          const a = document.createElement('a');
          a.className = 'btn primary'; a.href = r.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Abrir ' + chosen.name;
          go.replaceWith(a); sel.disabled = true;
          am.textContent = 'Cuando termines en el banco, copia el código y vuelve aquí.';
        } catch (er) { go.textContent = 'Ir al banco'; go.disabled = false; errEl.textContent = er.message; }
      };
      body.querySelector('#pasteBtn').onclick = async () => {
        try { body.querySelector('#codeIn').value = (await navigator.clipboard.readText()).trim(); }
        catch (e) { errEl.textContent = 'No he podido leer el portapapeles. Mantén pulsado el campo y elige Pegar.'; }
      };
      body.querySelector('#finishBtn').onclick = async () => {
        errEl.textContent = '';
        const raw = body.querySelector('#codeIn').value.trim();
        const m = raw.match(/^MC1\|([^|]+)\|(.+)$/);
        const code = m ? m[2] : raw;
        if (!code) { errEl.textContent = 'Pega primero el código.'; return; }
        if (m && m[1] !== S.bank.pendingState) { errEl.textContent = 'Ese código es de un intento anterior. Pulsa Ir al banco otra vez.'; return; }
        const btn = body.querySelector('#finishBtn'); btn.textContent = 'Conectando…'; btn.disabled = true;
        try {
          const s = await eb('/sessions', {method:'POST', body:{code}});
          const accs = (s.accounts || []).map(a => typeof a === 'string' ? a : a.uid).filter(Boolean);
          if (!accs.length) throw new Error('El banco no ha devuelto ninguna cuenta. Comprueba en el panel de Enable Banking que la tienes vinculada con Activate by linking accounts.');
          const first = !bankOn();
          S.bank.sessionId = s.session_id; S.bank.accounts = accs;
          S.bank.validUntil = s.access?.valid_until || S.bank.validUntil;
          S.bank.pendingState = ''; S.bank.err = '';
          if (first){ S.bank.since = iso(new Date()); S.bank.lastSync = 0; }
          save(); closeSheet(); render();
          toast(first ? 'Banco conectado' : 'Permiso renovado');
          syncBank(true);
        } catch (er) { errEl.textContent = er.message; btn.textContent = 'Terminar'; btn.disabled = false; }
      };
    }
  });
}
async function bankOff(){
  if (!confirm('Se desconecta el banco. Los movimientos que ya entraron se quedan. ¿Seguro?')) return;
  try { if (S.bank.sessionId) await eb('/sessions/' + encodeURIComponent(S.bank.sessionId), {method:'DELETE'}); } catch (e) {}
  const keep = {rules: S.bank.rules, worker: S.bank.worker};
  S.bank = Object.assign(freshBank(), keep);
  S.tx = S.tx.filter(t => !t.pending);
  try { await keySet(null); } catch (e) {}
  bankKey = null; save(); render(); toast('Banco desconectado');
}

/* ---------- Eventos ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$('#fab').onclick = () => txSheet();
$('#app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'refresh') refreshPrices(true);
  else if (a === 'month'){ curMonth = shiftMonth(curMonth, +el.dataset.d); render(); }
  else if (a === 'adjust') adjustSheet(el.dataset.k);
  else if (a === 'goinv'){ tab = 'inv'; render(); window.scrollTo(0, 0); }
  else if (a === 'newtx') txSheet({type:'transfer', from:el.dataset.from, to:el.dataset.to});
  else if (a === 'edit'){
    const t = S.tx.find(x => x.id === el.dataset.id); if (!t) return;
    txSheet({type:t.type, amount:String(t.amount).replace('.', ','), cat:t.cat || 'super', place:t.from || t.to || 'cuenta', from:t.type === 'transfer' ? t.from : 'cuenta', to:t.type === 'transfer' ? t.to : 'sp', qty:t.btc ? String(t.btc).replace('.', ',') : '', qtyTouched:!!t.btc, note:t.note || '', date:t.date, editId:t.id});
  }
  else if (a === 'savekey'){ S.key = $('#keyIn').value.trim(); save(); toast(S.key ? 'Clave guardada, probando…' : 'Clave borrada'); refreshPrices(true); }
  else if (a === 'bankwizard') bankWizard();
  else if (a === 'banksync') syncBank(true);
  else if (a === 'bankrenew') bankWizard(3);
  else if (a === 'bankoff') bankOff();
  else if (a === 'export') exportData();
  else if (a === 'import'){ const fi = $('#fileIn'); fi.onchange = () => fi.files[0] && importData(fi.files[0]); fi.click(); }
  else if (a === 'onboard') onboardSheet();
  else if (a === 'wipe'){ if (confirm('Se borran todos tus saldos y movimientos de este iPhone. ¿Seguro?')){ localStorage.removeItem(STORE); S = fresh(); S.bank = freshBank(); keySet(null).catch(() => {}); bankKey = null; render(); onboardSheet(); } }
});

let timer;
function startAuto(){ clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible') refreshPrices(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ refreshPrices(); syncBank(); } });

render();
if (!S.setup) onboardSheet();
refreshPrices(); startAuto();
loadKey().then(() => { if (bankOn()) syncBank(); render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
